services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: devdocs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devdocs
      POSTGRES_PASSWORD: devdocs_password
      POSTGRES_DB: devdocs_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdocs -d devdocs_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
